<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline · SalesFlow</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(150deg,#F5EBDD,#FFFDFB);color:#2C2230;padding:2rem;text-align:center}
    .box{max-width:400px}
    .icon{width:90px;height:90px;border-radius:24px;background:linear-gradient(135deg,#E98CAB,#B33B62);display:grid;place-items:center;margin:0 auto 1.5rem;box-shadow:0 12px 34px rgba(233,140,171,.4)}
    h1{font-size:1.6rem;margin-bottom:.5rem}p{color:#6B5E68;line-height:1.6;margin-bottom:1.5rem}
    button{padding:13px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#E98CAB,#B33B62);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
    <div class="icon"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg></div>
    <h1>Je bent offline</h1>
    <p>Er is momenteel geen internetverbinding. Sommige onderdelen van SalesFlow zijn beschikbaar, andere worden geladen zodra je weer online bent.</p>
    <button onclick="location.reload()">Opnieuw proberen</button>
</div>
</body>
</html>
